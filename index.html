<script type="module">
    import { top, navbar, footer } from "./components/navbar.js";
    // appending top part
    let top_part = document.querySelector("#top");
    top_part.innerHTML = top();

    // appending navbar part
    let header = document.querySelector("#header");
    header.innerHTML = navbar();

    // appending footer part
    let foot = document.querySelector("#footer");
    foot.innerHTML = footer();

    var user_click = document.querySelector(".user");

    var user_list = document.querySelector(".ham");

    user_list.style.display = "none";

    user_click.addEventListener("mouseover", function () {
        user_list.style.display = "block";
    });
    user_click.addEventListener("mouseout", function () {
        user_list.style.display = "none";
    });
    user_list.addEventListener("mouseover", function () {
        user_list.style.display = "block";
        user_click.style.backgroundColor = "#333333";
    });
    user_list.addEventListener("mouseout", function () {
        user_list.style.display = "none";
        user_click.style.backgroundColor = "";
    });
    
    document.getElementById("tourClick").addEventListener("click", function () {
        introJs().setOptions({
        steps: [
            {
                title: "Welcome to Snapdeal! 🎉",
                intro: "We’re excited to guide you through some of our most useful features so you can shop smarter and faster."
            },
            {
                element: document.querySelector("#our-blog"),

                intro: "Discover shopping tips, product reviews, and the latest trends curated just for you."
            },
            {
                element: document.querySelector("#help-center"),
                title: "Need assistance?",
                intro: "Our Help Center is your go-to place for tracking orders, returns, payments, and getting answers to your questions—all in one place."
            },
            {
                element: document.querySelector("#snap-deal"),
                title: "Ready to take your business to the next level? 🚀  ",
                intro: "Selling on Snapdeal is easy! Start listing your products and reach millions of potential customers across India. Let us show you how!"
            },
            {
                element: document.querySelector("#down-app"),
                title: "Never miss a deal! 📲",
                intro: "Download the Snapdeal app to shop on the go, get instant notifications, and access exclusive offers."
            },
            {
                element: document.querySelector("#input-search"),
                title: "Search for your favorite products with ease! 🔍",
                intro: "Simply type in what you're looking for, and we'll show you the best results from our vast collection."
            },
            {
                element: document.querySelector("#cart"),
                title: "This is your Cart! 🛒",
                intro: "Here you can review all the items you've added to your shopping list. Once you're ready, proceed to checkout and complete your purchase."
            },
            {
                element: document.querySelector("#user"),
                title: "To get the best shopping experience, please sign in to your Snapdeal account.",
                intro: "If you don’t have an account yet, it's quick and easy to create one!"
            },
            {
                element: document.querySelector("#top-category"),
                title: "Explore Our Top Categories! 🛒",
                intro: "Browse through our most popular product categories to find exactly what you're looking for. Whether it's electronics, fashion, or home goods, we've got you covered."
            },
            {
                element: document.querySelector("#more-category"),
                title: "Discover even more categories on Snapdeal!",
                intro: "Explore a wide range of products tailored to your needs. Whether you're looking for electronics, fashion, or home essentials, we've got it all."
            },
            {
                element: document.querySelector("#trending"),
                title: "Check out what's trending right now! 🔥",
                intro: "Discover the hottest products that everyone is talking about. Get your hands on the latest trends before they’re gone!"
            },
            {
                intro: "That’s it for the tour — thank you for visiting <strong>Snapdeal</strong>!<br>We hope you enjoy a seamless and satisfying shopping experience. 🛍️"
            }
        ],
        showProgress: true,
        showBullets: false,
        exitOnOverlayClick: false
        }).start();
    });

    //**** CODE for products list ****

    import getData from "./scripts/getData.js";

    let url = `https://profound-donut-01ca79.netlify.app/ecom.json`;

    let data = await getData(url);

    import { category, appendSearch } from "./index.js";

    let main = document.querySelector("#sidebar-popup");
    category(data, main);
    // let trenUrl="https://profound-donut-01ca79.netlify.app/trending.json"
    // let trending = await getData(trenUrl)
    // console.log(trending);
    // let trendMain=document.querySelector(".trnd")
    // console.log(trendMain);
    import { asyncData, appending, appendD } from "./fetch.js";

    let more_data = document.querySelector("#more-prod");
    let trend_p = document.querySelector("#trend-p");

    let res = await asyncData(
        `https://profound-donut-01ca79.netlify.app/trending.json`
    );

    appending(res, more_data);
    appendD(res, trend_p);
</script>

<script type="text/javascript">
    let counter = 1;

    setInterval(function () {
        document.getElementById("radio" + counter).checked = true;
        counter++;

        if (counter > 4) {
            counter = 1;
        }
    }, 5000);

//Here the logic of scroll to top
var scrollToTopBtn = document.getElementById("scrollToTopBtn");

window.addEventListener("scroll", function () {
  if (window.scrollY > 300) {
    scrollToTopBtn.classList.add("show");
  } else {
    scrollToTopBtn.classList.remove("show");
  }
});

scrollToTopBtn.addEventListener("click", function () {
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});

</script>
